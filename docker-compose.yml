services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cp-postgres
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: controlplane
    ports:
      - "56432:5432"
    volumes:
      - cp-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cp-redis
    ports:
      - "6379:6379"
    volumes:
      - cp-redis-data:/data

volumes:
  cp-postgres-data:
  cp-redis-data:
